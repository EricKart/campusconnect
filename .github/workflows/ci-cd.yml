name: CI/CD

on:
  push:
    branches: [master]
    # A GitOps deploy commit only touches k8s/ manifest image tags -- if
    # this workflow re-ran on that merge too, it would rebuild identical
    # images under a new tag, open ANOTHER manifest-bump PR, and merging
    # THAT would trigger the workflow again... forever. paths-ignore
    # breaks the loop at its source: manifest-only pushes never re-enter
    # the pipeline at all. pull_request has no such filter -- every PR,
    # including the bump PR itself, still gets fully tested and scanned.
    paths-ignore:
      - "k8s/**"
  pull_request:
    branches: [master]

# id-token: write is what lets Azure trust this specific workflow run via
# OIDC -- no client secret is stored in GitHub at all. contents/pull-requests
# write is NOT granted here at the workflow level -- only the deploy job
# below needs it, and least-privilege means every other job stays read-only.
permissions:
  id-token: write
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest tests -v
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-and-scan:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: backend
            dockerfile: backend/Dockerfile
          - service: worker
            context: backend
            dockerfile: backend/Dockerfile.worker
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build-args: NEXT_PUBLIC_API_URL=/api
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: az acr login --name ${{ vars.ACR_NAME }}

      # Build locally first -- the Trivy scan below runs BEFORE any push,
      # so a vulnerable image never reaches the registry at all.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          build-args: ${{ matrix.build-args || '' }}
          tags: ${{ vars.ACR_NAME }}.azurecr.io/campusconnect/${{ matrix.service }}:${{ github.sha }}

      # The real gate: fails the job on any CRITICAL vulnerability with a
      # known fix. Unfixed base-OS CVEs are ignored -- failing a pipeline
      # on a vulnerability nobody can patch yet teaches the wrong lesson.
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.ACR_NAME }}.azurecr.io/campusconnect/${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Only reachable if Trivy passed. Only pushes on an actual push to
      # master -- a pull request builds and scans, but never publishes.
      - if: github.event_name == 'push'
        run: docker push ${{ vars.ACR_NAME }}.azurecr.io/campusconnect/${{ matrix.service }}:${{ github.sha }}

  # GitOps deploy: this job never touches AKS at all -- no azure/login,
  # no kubectl, no cluster credentials. It only updates the image tags in
  # the k8s/ manifests and gets that change onto master. ArgoCD (running
  # inside the cluster, watching this repo) is what actually applies it.
  deploy:
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - run: |
          sed -i "s|campusconnect/api:.*|campusconnect/api:${{ github.sha }}|" k8s/api.yaml
          sed -i "s|campusconnect/worker:.*|campusconnect/worker:${{ github.sha }}|" k8s/worker.yaml
          sed -i "s|campusconnect/frontend:.*|campusconnect/frontend:${{ github.sha }}|" k8s/frontend.yaml

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy/${{ github.sha }}
          git commit -am "chore(deploy): bump image tags to ${{ github.sha }}"
          git push origin deploy/${{ github.sha }}
          gh pr create --title "chore(deploy): bump image tags to ${{ github.sha }}" \
            --body "Automated -- built and Trivy-scanned by this same workflow run. ArgoCD applies this once merged." \
            --base master --head deploy/${{ github.sha }}
          gh pr merge --auto --squash "deploy/${{ github.sha }}"
