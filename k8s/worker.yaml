apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: acrcampusconnectceb383.azurecr.io/campusconnect/worker:81244f054b1781c3d1923f3d2f18aa0434fa9ae7
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: campusconnect-secrets, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: campusconnect-secrets, key: redis-url } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: campusconnect-secrets, key: jwt-secret } }
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
          # No readiness/liveness probe here -- the worker exposes no HTTP
          # port to check. RQ's own reconnect logic + Kubernetes' normal
          # crash-restart is the safety net for this process.
