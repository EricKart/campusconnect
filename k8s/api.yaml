apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: acrcampusconnectceb383.azurecr.io/campusconnect/api:9bf69d800010a6d208381a04d590e53115c2a7c7
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: campusconnect-secrets, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: campusconnect-secrets, key: redis-url } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: campusconnect-secrets, key: jwt-secret } }
            - name: CORS_ORIGINS
              valueFrom: { secretKeyRef: { name: campusconnect-secrets, key: cors-origins } }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
